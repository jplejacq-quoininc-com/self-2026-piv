###
 # ca/x509/etc/ca-root.conf - common CA root configuration
 #
 # These are options in common to all certificate authority (CA)
 # root configurations.
 #
 # This configuration is used for the following purposes:
 #
 # * Creating CSR for root certificate.
 # * Signing (self) for the root certificate.
 # * Signing the intermediate certificate using the extensions defined
 #   here.
 #
 # The @c [req] section does not generate keys. This design lets
 # administrators fully control the process and keep consistency with
 # the elliptical key chain. Instead, the administrators use the @c
 # -key command line option.
 #
 # @warning The OpenSSL configuration file syntax is poorly documented
 #   and inconsistent. Further, there are no tools to validate the
 #   configuration other than running the programs. Double check all
 #   results.
 #
 # @section linting
 #
 # zlint, at this time the latest is 3.6.6, will produce the following
 # diagnostics for the configuration.
 #
 # - @c n_mp_allowed_eku - info
 #
 #   This means that the that the subordinate CA (SubCA) has an
 #   Extended Key Usage (EKU) OID from the Microsoft "Allowed EKUs for
 #   MP Enrollment" list is present. "MP" stands for Microsoft
 #   Management Point.
 #
 #   This is a false positive as the certificate has no EKUs. No
 #   action is required.
 #
 # - @c n_ca_digital_signature_not_set - info
 #
 #   Key Usage does not include digitalSignature. We have no use case
 #   that requires this usage. This is correct. No action is required.
 #
 # - @c n_sub_ca_eku_missing - info
 #
 #   This means subordinate CA (SubCA) certificate does not include an
 #   Extended Key Usage (EKU) extension.
 #
 #   This is correct and as designed. No action is required.
 #
 # - @c e_invalid_ca_certificate_policies - error
 #
 #   At least one CABF reserved policy OIDs MUST be present in a
 #   policy-restricted CA cert. This is not appropriate for a private
 #   PKI. Further, private policy OIDs should not be combined with
 #   CABF reserved policies.
 #
 #   This is a false positive. No action is required.
 #
 # @see https://docs.openssl.org/master/man5/config/
 # @see https://docs.openssl.org/master/man1/openssl-ca/
 # @see https://docs.openssl.org/master/man1/openssl-req/
 # @see https://pki-tutorial.readthedocs.io/
 #
 # @copyright copyright 2025 Quoin Inc.
 ##


###
 # CA root configuration overrides.
 ##
[ qi_ca_default ]
  ###
   # Default certificate validity period.
   #
   # The CA/Browser Forum does not specify a value for CA
   # certificates. Industry best practice is 5 to 25 years. We use 10
   # years.
   #
   # @default "30"
   ##
  default_days = "3650"


###
 # CA Intermediate PIV certificate extensions.
 #
 # A CA certificate isn't used for anything other that signing leaf
 # certificates. The Key Usage (KU) only needs @c keyCertSign and @c
 # cRLSign. Specifically, @c digitalSignature is not required even
 # though zlint will issue an info level diagnostic about it missing.
 #
 # There is the concept of "technically constrained" where EKU lists
 # the allowed EKU's that leaf certificates may have that are signed
 # by this certificate.
 #
 # The set of EKUs here are compatible with one another and pass
 # zlint. Additionally, by specifying these constraints zlint will not
 # issue the error @c e_invalid_ca_certificate_policies.
 #
 # - For slot 9A (authentication)
 #   - clientAuth (1.3.6.1.5.5.7.3.2) TLS client authentication
 #   - msSmartCardLogin (1.3.6.1.4.1.311.20.2.2)
 # - For slot 9C (signature)
 #   - emailProtection (1.3.6.1.5.5.7.3.4) for S/MIME.
 #   - codeSigning (1.3.6.1.5.5.7.3.3) for code signing.
 # - For slot 9D (encryption)
 #   - emailProtection (1.3.6.1.5.5.7.3.4) for S/MIME.
 #   - ekuDriveEncryption (1.3.6.1.4.1.311.67.1.1) for BitLocker.
 #   - msEFS (1.3.6.1.4.1.311.10.3.4)
 #   - msEFSRecovery (1.3.6.1.4.1.311.10.3.4.1)
 #
 # @note GnuPG @c gpgsm will not validate if the EKU includes @c
 #   critical. This is true even when the option @c
 #   ignore-cert-extension is used. zlint does not require @c
 #   critical.
 #
 # @note GnuPG @c gpgsm will not accept the intermediate certificate
 #   with the @c nameConstraint. The options @c "ignore-cert-extension
 #   2.5.29.30" is required.
 ##
[ qi_ca_intermediate_piv_extensions ]
  basicConstraints = "critical", "CA:true", "pathlen:0"
  keyUsage = "critical", "keyCertSign", "cRLSign"
  extendedKeyUsage = \
    "clientAuth", \
    "msSmartcardLogin", \
    "emailProtection", \
    "codeSigning", \
    "1.3.6.1.4.1.311.67.1.1", \
    "msEFS", \
    "1.3.6.1.4.1.311.10.3.4.1"
  subjectKeyIdentifier = "hash"
  authorityKeyIdentifier = "keyid:always"
  authorityInfoAccess = "@qi_ca_issuer_info"
  crlDistributionPoints = "@qi_ca_crl_info"
  certificatePolicies = "@qi_ca_intermediate_piv_policy"


###
 # Section for CA intermediate piv certificate policy.
 #
 # zlint will produce the following errors:
 #
 # - @c e_invalid_ca_certificate_policies - at least one CABF reserved
 #   policy OIDs @em MUST be present in a policy-restricted CA
 #   cert. This is not relevant for a private PKI issuing certificate
 #   so this is a false positive.
 ##
[ qi_ca_intermediate_piv_policy ]
  policyIdentifier = qi_ca_intermediate_piv_policy_oid
  CPS = ${qi_pki_base_url}qi-x509-ca-intermediate-piv-cps.html


###
 # CA Intermediate server certificate extensions.
 #
 # A CA certificate isn't used for anything other that signing leaf
 # certificates. There is the concept of "technically constrained"
 # where EKU lists the allowed EKU's that leaf certificates may have
 # that are signed by this certificate.
 #
 # The set of EKUs here are compatible with one another and pass
 # zlint.
 #
 # - serverAuth (1.3.6.1.5.5.7.3.1) - TLS Web Server Authentication
 #
 # There is no need for the following as it is deprecated.
 #
 # - ipsecIKE (1.3.6.1.5.5.7.3.17) - IPSec IKE
 # - ipsecIKEIntermediate (1.3.6.1.5.5.8.2.2) - used by old macOS
 #
 # CABF requires EKU not be set @c critical.
 #
 # @note @c timeStamp is incompatible with these. We don't have a need
 #   for this yet so not defining.
 ##
[ qi_ca_intermediate_server_extensions ]
  basicConstraints = "critical", "CA:true", "pathlen:0"
  keyUsage = "critical", "keyCertSign", "cRLSign", "digitalSignature"
  extendedKeyUsage = \
    "serverAuth"
  subjectKeyIdentifier = "hash"
  authorityKeyIdentifier = "keyid:always"
  authorityInfoAccess = "@qi_ca_issuer_info"
  crlDistributionPoints = "@qi_ca_crl_info"
  certificatePolicies = "@qi_ca_intermediate_server_policy"


###
 # Section for CA intermediate server certificate policy.
 #
 # zlint will produce the following errors:
 #
 # - @c e_invalid_ca_certificate_policies - at least one CABF reserved
 #   policy OIDs @em MUST be present in a policy-restricted CA
 #   cert. This is not relevant for a private PKI issuing certificate
 #   so this is a false positive.
 ##
[ qi_ca_intermediate_server_policy ]
  policyIdentifier = qi_ca_intermediate_server_policy_oid
  CPS = ${qi_pki_base_url}qi-x509-ca-intermediate-server-cps.html
