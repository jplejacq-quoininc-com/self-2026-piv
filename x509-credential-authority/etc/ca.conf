###
 # ca/x509/etc/conf.d/ca.conf - common CA configuration section
 #
 # These are options in common to all certificate authority (CA)
 # configurations.
 #
 # We intentionally do not specify the following options:
 #
 # - @c req_extensions Section for CSR extensions. Default is
 #   undefined. The use of @c copy_extensions='none' in the @c [ca]
 #   section renders @req_extensions ineffective.
 # - All directives related to key generation. Instead, we generate a
 #   key prior to generating the CSR and then use the @c -key command
 #   line option for the @c openssl-req utility.
 #
 # We have several constraints that severely limit our options. While
 # both Apple and Microsoft claim support for NIST P-256 ECC keys, in
 # practice they do not. Linux has excellent support for ECC,
 # including 25519 curve keys, as does YubiKeys.
 #
 # - Windows native IKEv2 VPN does not support mixed key certificate chains.
 # - Windows native smart card authentication does not work with ECC keys.
 # - macOS Apple Mail S/MIME signing and encryption only work with RSA keys.
 #
 # We these constraints, we create the following CA hierarchy.
 #
 # |- RSA Root
 # |  `- RSA Intermediate PIV
 # |     |- RSA PIV Authentication (slot 9A)
 # |     |- RSA PIV Digital Signature (slot 9C)
 # |     `- RSA PIV Key Management (slot 9D)
 # `- ECC Root
 #    `- ECC Intermediate PIV
 #       |- ECC Strong Swan
 #       |- ECC Nginx
 #       `- ...
 #
 #   src/com/example/credential/ca/x509/rsa/root/
 #
 # The common name, certificate and CRL distribution URL:
 #
 #   - CN=Example Inc. CA X.509 RSA Root
 #   - http://pki.example.org/qi-ca-x509-rsa-root.crt
 #   - http://pki.example.org/qi-ca-x509-rsa-root.crl
 #
 #
 # The directory will be:
 #
 #   src/com/example/credential/ca/x509/rsa/intermediate-piv/
 #
 # The common name, certificate and CRL distribution URL:
 #
 #   - CN=Example Inc. CA X.509 RSA Intermediate PIV
 #   - http://pki.example.org/qi-ca-x509-rsa-intermediate-piv.crt
 #   - http://pki.example.org/qi-ca-x509-rsa-intermediate-piv.crl
 #
 #
 # The directory will be:
 #
 #   src/com/example/credential/ca/x509/ecc/root/
 #
 # The common name, certificate and CRL distribution URL:
 #
 #   - CN=Example Inc. CA X.509 ECC Root
 #   - http://pki.example.org/qi-ca-x509-ecc-root.crt
 #   - http://pki.example.org/qi-ca-x509-ecc-root.crl
 #
 #
 # The directory will be:
 #
 #   src/com/example/credential/ca/x509/ecc/intermediate-server/
 #
 # The common name, certificate and CRL distribution URL:
 #
 #   - CN=Example Inc. CA X.509 ECC Intermediate Server
 #   - http://pki.example.org/qi-ca-x509-ecc-intermediate-server.crt
 #   - http://pki.example.org/qi-ca-x509-ecc-intermediate-server.crl
 #
 # @copyright copyright 2025 Quoin Inc.
 ##


###
 # Specify the default CA section.
 #
 # @default-convention 'CA_default'
 ##
[ ca ]
  default_ca = 'qi_ca_default'


###
 # CA configuration.
 ##
[ qi_ca_default ]
  ###
   # Subject DN display options.
   #
   # @default <undefined>
   ##
  name_opt = 'multiline', '-esc_msb', 'utf8'

  ###
   # Certificate display options.
   #
   # @defaults <undefined>
   ##
  cert_opt = 'ca_default'

  ###
   # Require unique subject. Default 'true'.
   ##
  unique_subject = 'true'

  ###
   # Default certificate validity period.
   #
   # The CA/Browser Forum has voted to progressively reduce the
   # maximum validity period for public TLS certificates in several
   # phases:
   #
   # - September 1, 2020: 397 days (13 months)
   # - March 15, 2026: Maximum validity reduced to 200 days.
   # - March 15, 2027: Maximum validity reduced to 100 days.
   #
   # The 13 month limit accounts for possible time zone differences
   # and ensures no certificate unintentionally exceeds the maximum
   # allowed period.
   #
   # This is for private TLS certificates so we are not strictly
   # required to follow these. We will try to comply.
   #
   # @default '30'
   ##
  default_days = '395'

  ###
   # Default message digest (hash algorithm) to be used for signing
   # certificates.
   #
   # @default 'sha256'
   ##
  default_md = 'sha256'


  ###
   # Distinguished Name does not include email.
   #
   # Modern security practices recommend setting this to 'false' to
   # align with RFC3850, which suggests email addresses should be in
   # the subjectAltName extension rather than the subject DN.
   #
   # @default 'true'
   ##
  email_in_dn = 'false'

  ###
   # Distinquished Name does not keep passed ordering.
   #
   # This is it to have consistency across all certificates.
   #
   # @default 'false'
   ##
  preserve = 'false'

  ###
   # Distinguished Name default policy section.
   #
   # @default-convention 'policy_match'
   ##
  policy = 'qi_ca_dn_policy'


  ###
   # Specify default section for creating certificates.
   #
   # @default <undefined>
   ##
  x509_extensions = 'qi_ca_extensions'

  ###
   # Copy certificate extensions from CSR, overriding if already
   # defined.
   #
   # @default 'none'
   ##
  copy_extensions = 'copyall'


  ###
   # Default CRL validity period.
   #
   # zlint warns if this is more than 10 days.
   #
   # @default '30'
   ##
  default_crl_days = '10'

  ###
   # Section for extensions for CRLs.
   #
   # @default-convention 'crl_ext'
   ##
  crl_extensions = 'qi_ca_crl_extensions'


###
 # CA certificate extensions.
 #
 # This is only used for creation of the certificate, not for the
 # Certificate Signing Request (CSR). The later is not used for a root
 # certificate.
 #
 # - @c basicConstraint must not include @c pathlen since a root
 #   certificate is self signed. This will result in the warning @c
 #   w_root_ca_basic_constraints_path_len_constraint_field_present.
 # - @c authorityInfoAccess must not be defined as it is not
 #   appropriate for a root certificate.
 # - @c crlDistributionPoints must not be defined as it is not
 #   appropriate for a root certificate.
 # - @c authorityKeyIdentifier cannot include 'issuer:always'.
 # - @c certificatePolicies must not be defined as it is not
 #   appropriate for a root certificate. zlint warning
 #   w_root_ca_contains_cert_policy
 ##
[ qi_ca_extensions ]
  basicConstraints = 'critical', 'CA:true'
  keyUsage = 'critical', 'keyCertSign', 'cRLSign', 'digitalSignature'
  subjectKeyIdentifier = 'hash'
  authorityKeyIdentifier = 'keyid:always'


###
 # CA certificate revocation list extensions.
 ##
[ qi_ca_crl_extensions ]
  authorityKeyIdentifier = 'keyid:always'
  authorityInfoAccess = '@qi_ca_issuer_info'


###
 # Distinguished Name default policy section.
 #
 # CABF requires that the Relative Distinguished Name (RDN) components
 # are in a specific order.
 #
 # - countryName (C)
 # - stateOrProvinceName (ST)
 # - localityName (L)
 # - streetAddress (street)
 # - postalCode (postalCode)
 # - organizationName (O)
 # - organizationUnitName (OU, optional)
 # - commonName (CN)
 # - UID (UID)
 # - surname (SN)
 # - givenName (GN)
 ##
[ qi_ca_dn_policy ]
  countryName = 'match'
  stateOrProvinceName = 'match'
  localityName = 'match'
  postalCode = 'match'
  streetAddress = 'match'
  organizationName = 'match'
  commonName = 'supplied'


###
 # Embedded issuer distribution point into certificate.
 ##
[ qi_ca_issuer_info ]
  caIssuers;URI = ${qi_ca_crt_url}


###
 # CRL distribution point embedded in certificate.
 ##
[ qi_ca_crl_info ]
  URI = ${qi_ca_crl_url}
