###
 # ca/x509/rsa/intermediate-piv/etc/ca.conf - Example PKI CA X.509
 #   RSA Intermediate PIV Configuration
 #
 # @copyright copyright 2025 Quoin Inc.
 ##


[ default ]
  ###
   # CA chain name.
   #
   # @warning Must be before includes.
   ##
  qi_ca_chain_base = 'rsa'

  ###
   # CA root name.
   #
   # @warning Must be before includes.
   ##
  qi_ca_name_base = 'intermediate-piv'


.include 'src/com/example/credential/ca/x509/etc/pki.conf'
.include 'src/com/example/credential/ca/x509/etc/dn.conf'
.include 'src/com/example/credential/ca/x509/etc/pen.conf'
.include 'src/com/example/credential/ca/x509/etc/default.conf'
.include 'src/com/example/credential/ca/x509/etc/req.conf'
.include 'src/com/example/credential/ca/x509/etc/ca.conf'
.include 'src/com/example/credential/ca/x509/etc/ca-intermediate-name-constraints.conf'


###
 # CA Intermediate PIV configuration overrides.
 ##
[ qi_ca_default ]
  ###
   # Default certificate validity period.
   #
   # The CA/Browser Forum does not specify a value for CA
   # certificates. Industry best practice is 5 to 25 years. We use 10
   # years.
   #
   # @default '30'
   ##
  default_days = '730'

  ###
   # Require unique subject.
   #
   # @default 'true'.
   ##
  unique_subject = 'true'


[ qi_ca_extensions ]
  basicConstraints = \
    'critical', \
    'CA:true', \
    'pathlen:0'


[ qi_req_extensions ]


###
 # CA Distinguished Name (DN) fields.
 #
 # Make sure that the policy allows each of the fields specified here.
 #
 # * @c organizationalUnitName must not be defined for a CA
 #   certificate.
 ##
[ qi_req_distinguished_name ]
  commonName = 'Example CA X.509 RSA Intermediate PIV 1'


###
 # Distinguished Name default policy section.
 #
 # - @c commonName
 #
 #   CABF has deprecated this in favor of Subject Alternate Name. We can only
 #   specify optional but the actual server configuration must @em not define
 #   it.
 #
 # - @c dnQualifier
 #
 #   CABF and openssl requires unique Distinguished Name. Since we do not use
 #   @c commonName, we use this field to have a unique Distinguished Name.
 ##
[ qi_ca_dn_policy ]
  UID = 'supplied'
  dnQualifier = 'supplied'
  givenName = 'supplied'
  surname = 'supplied'
  organizationalUnitName = 'supplied'


###
 # Certificate extensions for PIV slot 9A: PIV Authentication
 #
 # | OpenSSL alias    | OID                    |
 # |------------------|------------------------|
 # | clientAuth       | 1.3.6.1.5.5.7.3.2      |
 # | msSmartcardLogin | 1.3.6.1.4.1.311.20.2.2 |
 ##
[ qi_req_piv_authentication_extensions ]
  basicConstraints = \
    'critical', \
    'CA:false'
  keyUsage = \
    'critical', \
    'digitalSignature'
  extendedKeyUsage = \
    'critical', \
    'clientAuth', \
    'msSmartcardLogin'
  subjectKeyIdentifier = 'hash'
  authorityKeyIdentifier = 'keyid:always'
  authorityInfoAccess = '@qi_ca_issuer_info'
  crlDistributionPoints = '@qi_ca_crl_info'
  certificatePolicies = '@qi_piv_policy'


###
 # Certificate extensions for PIV slot 9C: Digital Signature
 ##
[ qi_req_piv_signature_extensions ]
  basicConstraints = \
    'critical', \
    'CA:false'
  keyUsage = \
    'critical', \
    'digitalSignature', \
    'nonRepudiation'
  extendedKeyUsage = \
    'critical', \
    'emailProtection', \
    'codeSigning'
  subjectKeyIdentifier = 'hash'
  authorityKeyIdentifier = 'keyid:always'
  authorityInfoAccess = '@qi_ca_issuer_info'
  crlDistributionPoints = '@qi_ca_crl_info'
  certificatePolicies = '@qi_piv_policy'


###
 # Certificate extensions for PIV slot 9D: Key Management
 #
 # The @c keyUsage values have to be consistent with the type of
 # key. We are using @c RSA. This requires a value of @c
 # keyEncipherment. @c RSA keys are required to support macOS and
 # Thunderbird.
 #
 # For documentation, here are all the options:
 #
 # - @c keyAgreement allows the key to be used for key exchange
 #   protocols, such as ECDH, where two parties derive a shared secret
 #   for encryption, commonly used with EC keys. This is the type of
 #   key we would like to use but macOS doesn't support it..
 # - @c keyEncipherment allows the key to be used to encrypt other
 #   keys (such as symmetric session keys), commonly used with RSA
 #   keys. zlint will issue the warning @c n_ecdsa_ee_invalid_ku and
 #   error @c e_ecdsa_allowed_ku if it is used. It is not required by
 #   Outlook for S/MIME. We need to use RSA keys so this is the value
 #   used.
 # - @c dataEncipherment allows keys to used directly to encrypt
 #   data. It is rarely used as most protocols use @c keyEncipherment
 #   for key exchange and then symmetric encryption for data. We leave
 #   it off.
 #
 # The extended key usage option can have these options. The last
 # three are Microsoft specific.
 #
 # | OpenSSL name       | OID                      | Description               |
 # |--------------------|--------------------------|---------------------------|
 # | emailProtection    | 1.3.6.1.5.5.7.3.4        | S/MIME                    |
 # | ekuDriveEncryption | 1.3.6.1.4.1.311.67.1.1   | BitLocker                 |
 # | msEFS              | 1.3.6.1.4.1.311.10.3.4   | Encrypting File System    |
 # | msEFSRecovery      | 1.3.6.1.4.1.311.10.3.4.1 | EFS recovery agents.      |
 ##
[ qi_req_piv_encryption_extensions ]
  basicConstraints = \
    'critical', \
    'CA:false'
  keyUsage = \
    'critical', \
    'keyEncipherment'
  extendedKeyUsage = \
    'critical', \
    'emailProtection', \
    '1.3.6.1.4.1.311.67.1.1', \
    'msEFS', \
    '1.3.6.1.4.1.311.10.3.4.1'
  subjectKeyIdentifier = 'hash'
  authorityKeyIdentifier = 'keyid:always'
  authorityInfoAccess = '@qi_ca_issuer_info'
  crlDistributionPoints = '@qi_ca_crl_info'
  certificatePolicies = '@qi_piv_policy'


###
 # Section for PIV certificate policy.
 ##
[ qi_piv_policy ]
  policyIdentifier = 'qi_piv_policy_oid'
  CPS = ${qi_pki_base_url}qi-ca-x509-piv-cps.html
