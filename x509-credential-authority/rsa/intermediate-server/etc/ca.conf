###
 # ca/x509/rsa/intermediate-server/etc/ca.conf - Example Inc PKI CA X.509 RSA
 #   Intermediate Server Configuration
 #
 # zlint will issue the following diagnostics for the intermediate certificate.
 #
 # - @c e_invalid_ca_certificate_policies (error)
 #
 #   CABF requires at least one CABF reserved policy OIDs MUST be
 #   present in a policy-restricted CA cert. We are not a public CA so
 #   this isn't appropriate and can be ignored.
 #
 # zlint will issue the following diagnostics for the subscriber certificates
 # issed by this CA intermediate certificate.
 #
 # - @c w_ext_subject_key_identifier_not_recommended_subscriber
 #
 #   zlint has two contradictory warnings. This one and @c
 #   w_ext_subject_key_identifier_missing_sub_cert. The CABF baseline
 #   requirements and RFC 5280 interpretation) recommends against including the
 #   SKI in subscriber certificates, as they are not used as issuers for other
 #   certificates, so chain building using SKI is not needed. The @c
 #   w_ext_subject_key_identifier_missing_sub_cert warning is for support of
 #   older tools and processes. However, OpenSSL has no mechanism for not
 #   defining a SKI. Given this, we do include SKIs in subscriber certificates
 #   so this warning can be ignored.
 #
 # @copyright copyright 2025 Quoin Inc.
 ##


[ default ]
  ###
   # CA chain name.
   #
   # @warning Must be before includes.
   ##
  qi_ca_chain_base = 'rsa'

  ###
   # CA root name.
   #
   # @warning Must be before includes.
   ##
  qi_ca_name_base = 'intermediate-server'


.include 'src/com/example/credential/ca/x509/etc/pki.conf'
.include 'src/com/example/credential/ca/x509/etc/dn.conf'
.include 'src/com/example/credential/ca/x509/etc/pen.conf'
.include 'src/com/example/credential/ca/x509/etc/default.conf'
.include 'src/com/example/credential/ca/x509/etc/req.conf'
.include 'src/com/example/credential/ca/x509/etc/ca.conf'
.include 'src/com/example/credential/ca/x509/etc/ca-intermediate-name-constraints.conf'


###
 # CA Intermediate Server configuration overrides.
 ##
[ qi_ca_default ]
  ###
   # Default certificate validity period.
   #
   # The CA/Browser Forum is gradually shortening the validity period for TLS
   # certificates. We can apply this to any server certificate. We do not issue
   # public certificates but it still makes sense to try to comply.
   #
   # | issued after | max validity period (days) |
   # |--------------|----------------------------|
   # | 2026-03-15   |                        200 |
   # | 2027-03-15   |                        100 |
   # | 2029-03-15   |                         47 |
   #
   # @default '30'
   ##
  default_days = '200'

  ###
   # Require unique subject.
   #
   # @default 'true'.
   ##
  unique_subject = 'true'



[ qi_ca_extensions ]
  basicConstraints = \
    'critical', \
    'CA:true', \
    'pathlen:0'


[ qi_req_extensions ]


###
 # CA Distinguished Name (DN) fields.
 #
 # Make sure that the policy allows each of the fields specified here.
 #
 # * @c organizationalUnitName must not be defined for a CA
 #   certificate.
 ##
[ qi_req_distinguished_name ]
  commonName = 'Example Inc. CA X.509 RSA Intermediate Server 1'


###
 # Distinguished Name default policy section.
 #
 # - @c commonName
 #
 #   CABF has deprecated this in favor of Subject Alternate Name. We can only
 #   specify optional but the actual server configuration must @em not define
 #   it.
 #
 # - @c dnQualifier
 #
 #   CABF and openssl requires unique Distinguished Name. Since we do not use
 #   @c commonName, we use this field to have a unique Distinguished Name.
 ##
[ qi_ca_dn_policy ]
  commonName = 'optional'
  dnQualifier = 'supplied'


###
 # Certificate extensions for TLS, typically web, servers.
 #
 # CABF requires that @c extendedKeyUsage not include 'critical'.
 #
 # Do not include @c keyAgreement in @keyUsage as it is used only for
 # static DH/ECDH certificates (which require @c keyAgreement) are
 # rarely deployed because they lack forward secrecy and are less
 # flexible
 ##
[ qi_req_tls_extensions ]
  basicConstraints = \
    'critical', \
    'CA:false'
  keyUsage = \
    'critical', \
    'digitalSignature'
  extendedKeyUsage = 'serverAuth'
  subjectKeyIdentifier = 'hash'
  authorityKeyIdentifier = 'keyid:always'
  authorityInfoAccess = '@qi_ca_issuer_info'
  crlDistributionPoints = '@qi_ca_crl_info'
  certificatePolicies = '@qi_server_policy'


###
 # Certificate extensions for IPsec servers.
 #
 # Do not include @c keyAgreement in @keyUsage as it is used only for
 # static DH/ECDH certificates (which require @c keyAgreement) are
 # rarely deployed because they lack forward secrecy and are less
 # flexible.
 #
 # - @c ipsecIKE
 #
 #   Do not include @c ipsecIKE (1.3.6.1.5.5.7.3.17). It is now obsolete and
 #   explicitly deprecated by CABF.
 #
 # - @c subjectKeyIdentifier
 #
 #   This is unfortunately complicated.
 #
 #   If set to 'hash' it will result in the zlint warning @c
 #   w_ext_subject_key_identifier_not_recommended_subscriber.
 #
 #   If set to 'none', it creates an empty Subject Key Identifier field in the
 #   certificate which can confuse tools. zlint will issue the warning @c
 #   w_ext_subject_key_identifier_missing_sub_cert. This is a deprecated warning
 #   meant only for supporting older tools.
 #
 #   If we leave out subjectKeyIdentifier, OpenSSL defaults to @c 'hash'.
 #
 #   I would prefer to not have SKI in the certificate but OpenSSL does not
 #   provide a good mechanism to do so. So we default to including the 'hash'.
 ##
[ qi_req_ipsec_extensions ]
  basicConstraints = \
    'critical', \
    'CA:false'
  keyUsage = \
    'critical', \
    'digitalSignature'
  extendedKeyUsage = 'serverAuth'
  subjectKeyIdentifier = 'hash'
  authorityKeyIdentifier = 'keyid:always'
  authorityInfoAccess = '@qi_ca_issuer_info'
  crlDistributionPoints = '@qi_ca_crl_info'
  certificatePolicies = '@qi_server_policy'


###
 # Section for server certificate policy.
 ##
[ qi_server_policy ]
  policyIdentifier = 'qi_server_policy_oid'
  CPS = ${qi_pki_base_url}qi-x509-server-cps.html
